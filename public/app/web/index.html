<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GI App: servicios, equipo y repertorio de Generación Indetenible.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GI App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#0a0a0b">
  <title>GI App</title>
  <style>
    html, body { background: #0a0a0b; margin: 0; height: 100%; }
    /* Pantalla de carga mientras arranca la app (en iPhone puede tardar unos segundos). */
    #gi-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #0a0a0b; color: #8a8a90; font: 14px -apple-system, system-ui, sans-serif; transition: opacity .3s; z-index: 9; }
    #gi-splash img { width: 88px; height: 88px; border-radius: 22px; }
    #gi-splash i { width: 26px; height: 26px; border: 2.5px solid #333; border-top-color: #fbae00; border-radius: 50%; animation: gi-spin .8s linear infinite; }
    @keyframes gi-spin { to { transform: rotate(360deg); } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="gi-splash"><img src="icons/Icon-192.png" alt="GI App"><i></i><span>Cargando GI App…</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('gi-splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 320); }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
